<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喫茶ゆかし</title>
<meta name="description" content="坂の途中の、ピクセルアートの喫茶店。開きっぱなしにして、のんびりどうぞ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0d0909; --ink: #efe0bf; --dim: #946a48; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'DotGothic16', monospace; display: grid; place-items: center; overflow: hidden; }
  .stage { position: relative; width: min(calc(100vw - 32px), calc((100vh - 72px) * 16 / 9)); }
  #view { display: block; width: 100%; height: auto; image-rendering: pixelated; outline: none; }
  #bubble {
    position: absolute; transform: translate(-50%, -100%); max-width: min(60%, 420px); width: max-content;
    background: #faf4e4; color: #2b1d1c; border: 3px solid #1a1214; box-shadow: 3px 3px 0 rgba(0, 0, 0, .35);
    padding: 6px 12px; font-size: clamp(11px, 1.5vw, 16px); line-height: 1.6;
    opacity: 0; transition: opacity .6s steps(4); pointer-events: none;
  }
  #bubble.show { opacity: 1; }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 8px; height: 8px; margin-left: -4px; background: #faf4e4; border: 3px solid #1a1214; border-top: 0; border-left: 0; transform: rotate(45deg); }
  .below { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; min-height: 24px; font-size: 13px; color: var(--dim); }
  #hint { transition: opacity 1s; }
  #hint.gone { opacity: 0; }
  #song { font: inherit; color: var(--dim); background: none; border: 0; padding: 0; cursor: pointer; }
  #song:empty { display: none; }
  #song:hover { color: var(--ink); }
  noscript { color: var(--dim); }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="view" tabindex="0" role="img" aria-label="喫茶ゆかし。ドアをクリックすると入店します。"></canvas>
    <div id="bubble" role="status" aria-live="polite"></div>
    <div id="jukebox" class="jb" hidden role="dialog" aria-label="ジュークボックス"></div>
    <div class="below">
      <span id="hint">ドアをクリックして、どうぞ。</span>
      <button id="song" aria-pressed="false"></button>
    </div>
  </div>
  <noscript>喫茶ゆかしは、JavaScript をつけると開店します。</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
