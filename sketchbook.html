<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喫茶ゆかし スケッチ帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1a1214; --paper: #2b1d1c; --ink: #efe0bf; --dim: #b88b5e; --line: #3e2a24; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'DotGothic16', monospace; line-height: 1.7; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: .1em; }
  h2 { font-size: 18px; margin: 48px 0 12px; color: var(--dim); border-bottom: 2px solid var(--line); padding-bottom: 4px; }
  p.note { color: var(--dim); margin: 0 0 12px; font-size: 14px; }
  canvas { image-rendering: pixelated; display: block; }
  #scene { width: 100%; height: auto; cursor: pointer; border: 4px solid #0d0909; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .tabs button { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--line); padding: 2px 14px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { border-color: #f6cf72; color: #f6cf72; }
  .tabs .note { margin: 0; align-self: center; }
  .bubble { min-height: 3.4em; background: #faf4e4; color: #2b1d1c; padding: 10px 14px; border: 3px solid #1a1214; box-shadow: 4px 4px 0 #57392c; margin-top: 16px; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .thumbs figure, .cast figure { margin: 0; background: var(--paper); padding: 8px; }
  .thumbs canvas { width: 100%; height: auto; }
  figcaption { font-size: 14px; margin-top: 6px; }
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .swatch { background: var(--paper); padding: 6px; font-size: 12px; }
  .swatch i { display: block; height: 32px; margin-bottom: 4px; }
  .swatch b { color: var(--dim); font-weight: normal; margin-right: 6px; }
  .cast { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .cast figure { display: flex; flex-direction: column; align-items: center; }
  footer { margin-top: 48px; color: var(--dim); font-size: 13px; }
  .listen { display: grid; gap: 6px; }
  .listen .genre { color: var(--dim); margin-top: 10px; }
  .listen .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--paper); padding: 6px 10px; }
  .listen .row .name { flex: 1 1 220px; }
  .listen .row .name small { display: block; color: var(--dim); font-size: 12px; }
  .listen button { font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line); padding: 1px 10px; cursor: pointer; }
  .listen button[aria-pressed="true"] { border-color: #f6cf72; color: #f6cf72; }
  .listen .code { color: #e89a4a; margin-right: .5em; }
  textarea { width: 100%; font: inherit; background: var(--paper); color: var(--ink); border: 2px solid var(--line); padding: 8px; }
  a { color: #f6cf72; }
</style>
</head>
<body>
<main>
  <h1>喫茶ゆかし スケッチ帳</h1>
  <p class="note">店づくりの作業台。<a href="./">店の入口へ</a></p>

  <h2>角の席から</h2>
  <p class="note">お客さんの席から見た店。時計は本当の時刻。おくのさんをクリックすると、ひとりごと。本棚のどこかに、気になる帳面が一冊。</p>
  <div class="tabs" id="tabs"></div>
  <div class="tabs"><button id="music" aria-pressed="false">♪ ジュークボックス</button><span class="note" id="song"></span></div>
  <p class="note" id="status"></p>
  <canvas id="scene"></canvas>
  <div class="bubble" id="bubble">……</div>

  <h2>試聴室</h2>
  <p class="note">ジュークボックスの全曲。▶で聴いて、感想を選んでください。いちばん下のボタンで、感想をまとめてコピーできます（Claude に貼りつけてもらえれば、それをもとに直します）。</p>
  <div class="listen" id="listen"></div>
  <p><textarea id="listen-memo" rows="3" placeholder="ほかに気づいたこと（なくてもいいです）"></textarea></p>
  <div class="tabs"><button id="listen-copy">感想をまとめてコピー</button><span class="note" id="listen-copied"></span></div>

  <h2>時間帯の光</h2>
  <div class="thumbs" id="thumbs"></div>

  <h2>小物（実寸と拡大）</h2>
  <div class="cast" id="cast"></div>

  <h2>パレット（29色）</h2>
  <p class="note">店の絵はこの色だけで描く。左の記号は、ドット絵の文字列で使うキー。</p>
  <div class="palette" id="palette"></div>

  <footer>版 <span id="version"></span>・<a href="https://github.com/koki-hq/warpix-yukashi/releases">店の歩み</a></footer>
</main>
<script type="module" src="./src/sketchbook.js"></script>
</body>
</html>
